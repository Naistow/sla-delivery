services:
  db:
    image: mcr.microsoft.com/mssql/server:2022-latest
    environment:
      ACCEPT_EULA: "Y"
      MSSQL_SA_PASSWORD: ${DB_PASSWORD}
    ports:
      - "1433:1433"
    volumes:
      - mssql-data:/var/opt/mssql
    healthcheck:
      test:
        - CMD-SHELL
        - /opt/mssql-tools18/bin/sqlcmd -S localhost -U sa -P "$$MSSQL_SA_PASSWORD" -C -Q "SELECT 1" || /opt/mssql-tools/bin/sqlcmd -S localhost -U sa -P "$$MSSQL_SA_PASSWORD" -Q "SELECT 1" || exit 1
      interval: 10s
      timeout: 5s
      retries: 10
      start_period: 20s

  app:
    build: .
    environment:
      DB_HOST: db
      DB_PORT: "1433"
      DB_NAME: ${DB_NAME:-sla_delivery}
      DB_USER: ${DB_USER:-sa}
      DB_PASSWORD: ${DB_PASSWORD}
    volumes:
      - ./exchange:/srv/exchange
    depends_on:
      db:
        condition: service_healthy

  api:
    build: .
    command: ["uvicorn", "integration.server:app", "--host", "0.0.0.0", "--port", "8000"]
    environment:
      DB_HOST: db
      DB_PORT: "1433"
      DB_NAME: ${DB_NAME:-sla_delivery}
      DB_USER: ${DB_USER:-sa}
      DB_PASSWORD: ${DB_PASSWORD}
      DIRECTORY_URL: ${DIRECTORY_URL:-http://localhost:8080/1c_base/hs}
    ports:
      - "8000:8000"
    depends_on:
      db:
        condition: service_healthy

volumes:
  mssql-data: